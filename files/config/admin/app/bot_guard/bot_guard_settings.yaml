menu:
  group: bot_guard
  position: 2020

order_by:
  id: asc

sortable_fields:
  id: id
  enabled: enabled
  blockEmptyUserAgent: blockEmptyUserAgent
  loggingEnabled: loggingEnabled
  trustReferrer: trustReferrer
  underAttack: underAttack
  cookieWhitelistUserAgents: cookieWhitelistUserAgents
  blockStatusCode: blockStatusCode
  retentionDays: retentionDays
  updatedAt: updatedAt

view:
  edit:
    template: 'admin/bot_guard/settings/edit.html.twig'
  index:
    template: 'admin/bot_guard/settings/index.html.twig'
    fields:
      id: ~
      enabled:
        size: xl
        type: checkbox
      underAttack:
        size: xl
        type: checkbox
      blockEmptyUserAgent:
        size: xl
        type: checkbox
      loggingEnabled:
        size: xl
        type: checkbox
      trustReferrer:
        size: xl
        type: checkbox
      blockStatusCode:
        size: xl
      cookieWhitelistUserAgents:
        size: xxxl
      retentionDays:
        size: xl
      rateLimitEnabled:
        size: xl
        type: checkbox
      rateLimitMaxRequests:
        size: xl
      rateLimitWindowSeconds:
        size: xl
      reduceLoggingUnderAttack:
        size: xl
        type: checkbox
      autoUnderAttackEnabled:
        size: xl
        type: checkbox
      autoUnderAttackCpuPercent:
        size: xl
      autoUnderAttackMemPercent:
        size: xl
      autoUnderAttackDurationMinutes:
        size: xl
      autoUnderAttackReleasePercent:
        size: xl
      updatedAt:
        size: xl
        type: datetime

form:
  filter:
    fields:
      enabled:
        compare_strict: false
      blockEmptyUserAgent:
        compare_strict: false
      loggingEnabled:
        compare_strict: false
      underAttack:
        compare_strict: false
      trustReferrer:
        compare_strict: false
      blockStatusCode:
      cookieWhitelistUserAgents:
      retentionDays:
  index:
    fields:
      enabled: ~
      blockEmptyUserAgent: ~
      loggingEnabled: ~
      underAttack: ~
      trustReferrer: ~
      blockStatusCode: ~
      cookieWhitelistUserAgents: ~
      retentionDays: ~
      rateLimitEnabled: ~
      rateLimitMaxRequests: ~
      rateLimitWindowSeconds: ~
      reduceLoggingUnderAttack: ~
      autoUnderAttackEnabled: ~
      autoUnderAttackCpuPercent: ~
      autoUnderAttackMemPercent: ~
      autoUnderAttackDurationMinutes: ~
      autoUnderAttackReleasePercent: ~
  edit:
    fields:
      enabled: ~
      blockEmptyUserAgent: ~
      loggingEnabled: ~
      underAttack: ~
      trustReferrer: ~
      blockStatusCode: ~
      cookieWhitelistUserAgents:
        type: Symfony\Component\Form\Extension\Core\Type\TextareaType
        options:
          required: false
          attr:
            rows: 4
            placeholder: "YandexBot\nGooglebot\nbingbot"
      retentionDays:
        options:
          attr:
            min: 1
            max: 3650
      rateLimitEnabled: ~
      rateLimitMaxRequests:
        options:
          attr:
            min: 1
            max: 10000
      rateLimitWindowSeconds:
        options:
          attr:
            min: 10
            max: 3600
      reduceLoggingUnderAttack: ~
      autoUnderAttackEnabled: ~
      autoUnderAttackCpuPercent:
        options:
          attr:
            min: 50
            max: 100
      autoUnderAttackMemPercent:
        options:
          attr:
            min: 50
            max: 100
      autoUnderAttackDurationMinutes:
        options:
          attr:
            min: 1
            max: 120
      autoUnderAttackReleasePercent:
        options:
          attr:
            min: 40
            max: 99
